[project]
name = "learning-spark-v2-python"
version = "0.1.0"
description = "Python/PySpark conversion of the Learning Spark, 2nd Edition examples."
requires-python = ">=3.9,<3.12"
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "mlflow>=2.10.0,<3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "click>=8.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py39"
